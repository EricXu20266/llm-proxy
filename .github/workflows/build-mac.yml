name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean mirror config and lockfile
        run: |
          rm -f frontend/.npmrc
          rm -f frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Vite build
        run: cd frontend && npx vite build
      - name: TSC build
        run: cd frontend && npx tsc -p tsconfig.electron.json
      - name: Write dist-electron package.json
        run: cd frontend && node -e "require('fs').writeFileSync('dist-electron/package.json', JSON.stringify({type:'commonjs'}))"
      - name: Check build artifacts
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== Dist files ==="
          ls -la frontend/dist/ 2>/dev/null || echo "no dist/"
          ls -la frontend/dist-electron/ 2>/dev/null || echo "no dist-electron/"
          echo "=== electron-builder available? ==="
          cd frontend && npx electron-builder --version 2>&1 || echo "electron-builder not found"
      - name: Package macOS
        run: cd frontend && ./node_modules/.bin/electron-builder --mac --x64
        env:
          DEBUG: electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: LLMProxy-macOS
          path: frontend/release/*.dmg
      - name: Upload debug logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-logs
          path: |
            ~/Library/Logs/electron-builder*
            frontend/release/*.yml
