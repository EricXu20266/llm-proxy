name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: cd frontend && npm install --verbose
      - name: Build macOS app
        run: cd frontend && npm run package:mac
        env:
          DEBUG: electron-builder
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: LLMProxy-macOS
          path: frontend/release/*.dmg
      - name: Upload debug logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-logs
          path: |
            /Users/runner/Library/Logs/electron-builder*
            frontend/release/*.yml
